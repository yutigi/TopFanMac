[workspace]
resolver = "2"
members = ["crates/smc", "crates/fand", "crates/topfan", "crates/menubar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
smc = { path = "crates/smc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0"
