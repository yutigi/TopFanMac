[package]
name = "topfan-mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Workspace-root shim: plain `cargo run` launches the menubar app"
default-run = "topfan-mac"

[workspace]
resolver = "2"
members = ["crates/smc", "crates/fand", "crates/topfan", "crates/menubar"]
# "." must be here so `cargo run` still finds the topfan-mac shim; the crates
# must be here so `cargo build`/`cargo test` still cover the whole workspace
# like they did when the root was a virtual manifest.
default-members = [".", "crates/smc", "crates/fand", "crates/topfan", "crates/menubar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
smc = { path = "crates/smc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0"

[dependencies]
menubar = { path = "crates/menubar" }